name: Prebuild
on:
  workflow_dispatch:
    inputs:
      libudx:
        description: 'libudx reference, e.g. github:holepunchto/libudx#fb2d472'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prebuild:
    strategy:
      matrix:
        include:
          - os: windows-2022
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    steps:
      - run: apt update && apt install -y git clang lld
        if: ${{ matrix.platform == 'linux' }}
      - uses: holepunchto/actions/bare-base@v1
      - name: Point the build at the requested libudx
        shell: bash
        env:
          LIBUDX: ${{ inputs.libudx }}
        run: |
          sed -i.bak -E "s|fetch_package\\(\"github:[^\"]*libudx#[^\"]*\"\\)|fetch_package(\"${LIBUDX}\")|" CMakeLists.txt
          grep -n libudx CMakeLists.txt
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: ${{ matrix.flags }}
          tags: ${{ matrix.tags}}
          upload: true
